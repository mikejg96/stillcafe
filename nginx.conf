server {
    # Same port the deployment already uses.
    listen 4173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Frames, videos and images are large and don't change once published.
    location /asset/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
